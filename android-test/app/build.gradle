plugins {
    id 'com.android.application' version '7.4.2'
}

android {
    namespace 'com.awa.aichat'
    compileSdk 33

    defaultConfig {
        applicationId "com.awa.aichat"
        minSdk 9       // Android 2.3 Gingerbread
        targetSdk 22   // Android 5.1
        versionCode 1
        versionName "0.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}

dependencies {}
