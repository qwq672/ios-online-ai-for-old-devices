apply plugin: 'com.android.application'

android {
    compileSdkVersion 28

    defaultConfig {
        applicationId "com.awa.aichat"
        minSdkVersion 9
        targetSdkVersion 22
        versionCode 3
        versionName "0.5.0"

        // v261113: NDK — 共享 C 层（SSE 解析器）
        externalNativeBuild {
            cmake {
                cppFlags ""
                // armeabi-v7a 覆盖大多数 Android 2.3 设备
                abiFilters 'armeabi-v7a', 'x86'
            }
        }
    }

    // v261113: CMake 构建 SSE 共享库
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    sourceSets {
        main {
            java.srcDirs = ['src/main/java']
            res.srcDirs = ['src/main/res']
            manifest.srcFile 'src/main/AndroidManifest.xml'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_7
        targetCompatibility JavaVersion.VERSION_1_7
    }

    lintOptions {
        abortOnError false
    }
}

dependencies {
}
