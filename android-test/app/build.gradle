apply plugin: 'com.android.application'

android {
    namespace 'com.awa.aichat'
    compileSdk 33

    defaultConfig {
        applicationId "com.awa.aichat"
        minSdk 9
        targetSdk 22
        versionCode 1
        versionName "0.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}

dependencies {}
