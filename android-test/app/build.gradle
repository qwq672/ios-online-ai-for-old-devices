apply plugin: 'com.android.application'

android {
    compileSdkVersion 28

    defaultConfig {
        applicationId "com.awa.aichat"
        // v261103: Android 2.3 (Gingerbread) — targets old devices that
        // can't run modern AI chat apps (ChatGPT needs Android 6+).
        minSdkVersion 9       // Android 2.3
        targetSdkVersion 22   // Android 5.1 (avoids runtime permission model)
        versionCode 1
        versionName "0.1.0"
    }

    sourceSets {
        main {
            java.srcDirs = ['src/main/java']
            res.srcDirs = ['src/main/res']
            manifest.srcFile 'src/main/AndroidManifest.xml'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_7
        targetCompatibility JavaVersion.VERSION_1_7
    }

    lintOptions {
        abortOnError false
    }
}

dependencies {
    // No external deps — pure Android SDK + org.json (built in).
    // This keeps the APK tiny and compatible with Android 2.3.
}
