// Top-level build file — configures Gradle plugins for all subprojects.
buildscript {
    repositories {
        google()
        jcenter()
    }
    dependencies {
        // AGP 4.0.x — works with Java 8, supports minSdk 9.
        classpath 'com.android.tools.build:gradle:4.0.2'
    }
}

allprojects {
    repositories {
        google()
        jcenter()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
