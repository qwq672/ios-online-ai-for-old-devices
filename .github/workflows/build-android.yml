name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-33" "build-tools;33.0.2" "platform-tools" 2>&1 | tail -5

      - name: Install Gradle 7.5
        run: |
          wget -q https://services.gradle.org/distributions/gradle-7.5-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/
          /tmp/gradle-7.5/bin/gradle --version

      - name: Generate wrapper + local.properties
        working-directory: android-test
        run: |
          /tmp/gradle-7.5/bin/gradle wrapper --gradle-version 7.5
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "Wrapper generated, local.properties created"

      - name: Build debug APK
        working-directory: android-test
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
          echo "EXIT CODE: $?"
          echo "=== APK search ==="
          find / -name "*.apk" -type f 2>/dev/null | head -10
          echo "=== build outputs ==="
          ls -laR app/build/outputs/ 2>/dev/null || echo "no outputs dir"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIChat-android-debug
          path: android-test/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Attach APK to release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android-test/app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
