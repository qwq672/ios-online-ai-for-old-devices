name: Build Android APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android-test/**'
      - '.github/workflows/build-android.yml'
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          yes | sdkmanager --licenses || true
          # v0.2: android-test uses AGP 4.0.2 + compileSdkVersion 28.
          # Install android-28 platform + build-tools 28.0.3 (matching).
          sdkmanager --install "platforms;android-28" "build-tools;28.0.3" "platform-tools" 2>&1 | tail -5

      - name: Install Gradle 6.1.1
        run: |
          # v0.2: AGP 4.0.2 requires Gradle 6.1.1 (the android-test project's
          # gradle-wrapper.properties pins this version). Install matching.
          wget -q https://services.gradle.org/distributions/gradle-6.1.1-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/
          /tmp/gradle-6.1.1/bin/gradle --version

      - name: Generate wrapper + local.properties
        working-directory: android-test
        run: |
          /tmp/gradle-6.1.1/bin/gradle wrapper --gradle-version 6.1.1
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build debug APK
        working-directory: android-test
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace
          echo "=== APK search ==="
          find . -name "*.apk" -type f
          ls -la app/build/outputs/apk/debug/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AIAnyWhere-android-debug
          path: android-test/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Attach APK to release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android-test/app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
