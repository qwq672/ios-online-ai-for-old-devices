name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Accept Android SDK licenses + install platform
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-28" "build-tools;28.0.3" "platform-tools" 2>&1 | tail -10
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "SDK root contents:"
          ls $ANDROID_HOME/platforms/ 2>/dev/null || echo "No platforms dir"

      - name: Install Gradle 6.1.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-6.1.1-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/
          echo "/tmp/gradle-6.1.1/bin" >> $GITHUB_PATH

      - name: Generate Gradle wrapper
        working-directory: android-test
        run: gradle wrapper --gradle-version 6.1.1

      - name: Build debug APK
        working-directory: android-test
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace
          echo "=== Build output ==="
          find . -name "*.apk" -type f
          ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "No debug output dir"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIChat-android-debug
          path: |
            android-test/app/build/outputs/apk/debug/app-debug.apk
            android-test/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Attach APK to release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android-test/app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
