name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          sdk-platform: 28
          sdk-build-tools: 28.0.3

      - name: Install Gradle 6.1.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-6.1.1-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/
          echo "/tmp/gradle-6.1.1/bin" >> $GITHUB_PATH

      - name: Generate Gradle wrapper
        working-directory: android-test
        run: gradle wrapper --gradle-version 6.1.1

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build debug APK
        working-directory: android-test
        run: ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tail -80

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIChat-android-debug
          path: android-test/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Attach APK to release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android-test/app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
