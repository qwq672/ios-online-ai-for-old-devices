name: Build iOS IPA

# Compiles the iOS6AIChat Xcode project on a macOS GitHub runner and
# packages the .app bundle into an unsigned .ipa. The IPA is uploaded
# as a workflow artifact — download it from the Actions tab and
# self-sign it via Sideloadly/AltStore (instructions in README.md).
#
# IMPORTANT — about iOS 6 deployment target
# ----------------------------------------
# The default IPHONEOS_DEPLOYMENT_TARGET in the project is 8.0 because
# the macOS runners only ship modern Xcode (>=14) which no longer
# supports deployment targets lower than iOS 11. To get a *true* iOS 6
# build you must either:
#   (a) install Xcode 8 on your own Mac and `xcodebuild` locally, or
#   (b) self-host a macOS runner with the legacy Xcode toolchain.
# The UI is skeuomorphic-iOS-6 styled regardless of OS target.
#
# The CI pipeline below keeps a "maximal compatibility" path that:
#   * uses macos-13 (still has Xcode 14.x), default deployment = 8.0
#   * downgrades the target to 11.0 in CI to silence the SDK error,
#     then ships an IPA that runs on iOS 11+ out of the box.
# To produce a stricter binary, change CI_XCODE_PATH and CI_DEPLOYMENT
# env below to match your self-hosted setup.

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  # Path of the Xcode installation to use. macos-13 has Xcode 14.x at this path.
  # Override in repo → Settings → Secrets → CI_XCODE_PATH if you self-host.
  CI_XCODE_PATH: /Applications/Xcode.app
  # In CI we override the deployment target to 11.0 — the lowest that
  # Xcode 14+ will reliably compile without warnings. Locally you can
  # lower this to 6.0 with old Xcode.
  CI_DEPLOYMENT_TARGET: "11.0"

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select --switch "$CI_XCODE_PATH"
          xcodebuild -version
          xcodebuild -showsdks | grep -E 'iphoneos|iOS'

      - name: Show project settings
        run: |
          xcodebuild -project iOS6AIChat.xcodeproj \
                     -target iOS6AIChat \
                     -showBuildSettings

      - name: Build .app (no code sign)
        run: |
          set -euo pipefail
          xcodebuild \
            -project iOS6AIChat.xcodeproj \
            -target iOS6AIChat \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            IPHONEOS_DEPLOYMENT_TARGET="$CI_DEPLOYMENT_TARGET" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CONFIGURATION_BUILD_DIR="$PWD/build" \
            build

      - name: Verify .app bundle
        run: |
          ls -la build/
          test -f build/iOS6AIChat.app/iOS6AIChat || { echo "Missing binary"; exit 1; }

      - name: Package .ipa
        run: |
          set -euo pipefail
          mkdir -p Payload
          cp -R build/iOS6AIChat.app Payload/
          zip -r -X iOS6AIChat-unsigned.ipa Payload
          ls -la iOS6AIChat-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS6AIChat-unsigned-ipa
          path: iOS6AIChat-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Attach IPA to release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: iOS6AIChat-unsigned.ipa
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
