name: Build UWP App

on:
  push:
    branches: [ main ]
    paths:
      - 'uwp/**'
      - '.github/workflows/build-uwp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1

      - name: Restore NuGet packages
        run: msbuild uwp/AIAnyWhere.sln /t:Restore /p:Configuration=Release /p:Platform=x86

      - name: Create self-signed certificate
        run: |
          $pwd = ConvertTo-SecureString -String "AIAnyWhere2026" -Force -AsPlainText
          New-SelfSignedCertificate -Type Custom -Subject "CN=AIAnyWhere" -KeyUsage DigitalSignature -FriendlyName "AIAnyWhere Dev Cert" -CertStoreLocation "Cert:\CurrentUser\My" -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3","2.5.29.19={text}")
          $cert = Get-ChildItem -Path "Cert:\CurrentUser\My" | Where-Object { $_.Subject -eq "CN=AIAnyWhere" }
          $certPath = Join-Path $env:GITHUB_WORKSPACE "AIAnyWhereDev.pfx"
          Export-PfxCertificate -Cert $cert -FilePath $certPath -Password $pwd
          # Export public cert (.cer) for user to trust
          $cerPath = Join-Path $env:GITHUB_WORKSPACE "AIAnyWhereDev.cer"
          Export-Certificate -Cert $cert -FilePath $cerPath
          # Print thumbprint for MSBuild
          Write-Output "AIANYWHERE_CERT_THUMB=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      - name: Build UWP (.appx with signing)
        run: |
          msbuild uwp/AIAnyWhere.sln /p:Configuration=Release /p:Platform=x86 /p:AppxBundle=Always /p:AppxBundlePlatforms="x86" /p:AppxPackageDir="AppPackages" /p:AppxPackageSigningEnabled=true /p:PackageCertificateThumbprint="$env:AIANYWHERE_CERT_THUMB" /p:PackageCertificateKeyFile="AIAnyWhereDev.pfx" /p:PackageCertificatePassword="AIAnyWhere2026"

      - name: Upload .appx + .cer
        uses: actions/upload-artifact@v4
        with:
          name: AIAnyWhere-uwp-signed
          path: |
            uwp/**/AppPackages/**/*.appx
            AIAnyWhereDev.cer

      - name: Attach to release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            uwp/AppPackages/**/*.appx
            AIAnyWhereDev.cer
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
